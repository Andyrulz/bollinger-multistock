# Unified Trading Bots Config
# - /tradebot-kite/      -> existing Nifty bot on port 3000
# - /tradebot-multistock/ -> Bollinger bot on port 3001

server {
    listen 80;
    server_name 98.70.40.23;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 98.70.40.23;

    ssl_certificate /etc/nginx/ssl/tradebot.crt;
    ssl_certificate_key /etc/nginx/ssl/tradebot.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;

    # Root: landing page with links to both bots
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><title>Trading Bots</title><style>body{font-family:system-ui;max-width:600px;margin:80px auto;text-align:center;background:#0f172a;color:#e2e8f0}a{display:block;padding:20px;margin:16px;background:#1e293b;border:1px solid #334155;border-radius:12px;color:#60a5fa;text-decoration:none;font-size:1.2rem}a:hover{background:#334155;border-color:#60a5fa}</style></head><body><h1>Trading Bots</h1><a href="/tradebot-kite/">Nifty Trading Bot</a><a href="/tradebot-multistock/">Multi-Stock Bollinger Bot</a></body></html>';
    }

    # Existing Nifty bot: strip /tradebot-kite prefix, proxy to port 3000
    location /tradebot-kite/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        # Rewrite redirect Location headers from upstream
        proxy_redirect / /tradebot-kite/;

        # Rewrite HTML content: absolute links -> prefixed links
        sub_filter_once off;
        sub_filter "href=\"/" "href=\"/tradebot-kite/";
        sub_filter "action=\"/" "action=\"/tradebot-kite/";
        sub_filter "fetch('/" "fetch('/tradebot-kite/";
        sub_filter "window.location.href = '/" "window.location.href = '/tradebot-kite/";
    }

    # Bollinger multi-stock bot: strip /tradebot-multistock prefix, proxy to port 3001
    # This bot has BASE_PATH awareness in code, so minimal nginx rewriting needed
    location /tradebot-multistock/ {
        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        # No proxy_redirect needed — app handles basePath in all redirects
    }
}
